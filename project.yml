name: Hermes
options:
  bundleIdPrefix: com.prismtrade
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 6833T8P572
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 9
    MARKETING_VERSION: 1.1
targets:
  Hermes:
    type: application
    platform: iOS
    sources:
      - path: Sources/HermesApp
      - path: Sources/HermesCore
      - path: Supporting/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prismtrade.hermes
        INFOPLIST_KEY_CFBundleDisplayName: Elara
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Elara
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
  HermesCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HermesCoreTests
    dependencies:
      - target: Hermes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.prismtrade.hermes.tests

  HermesUITests:
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HermesUITests
    dependencies:
      - target: Hermes
schemes:
  Hermes:
    build:
      targets:
        Hermes: all
    test:
      targets:
        - HermesCoreTests
        - HermesUITests
